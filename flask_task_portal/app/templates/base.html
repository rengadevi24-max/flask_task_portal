<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Simple Library{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <a href="{{ url_for('home') }}">Simple Library</a>
    <span>
        <a href="{{ url_for('books.list_books') }}">Books</a>
        <a href="{{ url_for('members.list_members') }}">Members</a>
        <a href="{{ url_for('reservations.list_reservations') }}">Reservations</a>
    </span>
</nav>
<main>
    {# get_flashed_messages reads messages created by flash() #}
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
