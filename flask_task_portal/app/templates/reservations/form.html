{% extends "base.html" %}
{% block title %}Add Reservation · Simple Library{% endblock %}
{% block content %}
<h1>Add a reservation</h1>
<form method="post" class="card">
    <label>Book
        <select name="book_id" required>
            <option value="">Choose a book</option>
            {% for book in books %}<option value="{{ book.id }}">{{ book.title }}</option>{% endfor %}
        </select>
    </label>
    <label>Member
        <select name="member_id" required>
            <option value="">Choose a member</option>
            {% for member in members %}<option value="{{ member.id }}">{{ member.name }}</option>{% endfor %}
        </select>
    </label>
    <label>Reservation date
        <input type="date" name="reservation_date" required>
    </label>
    <button type="submit">Save reservation</button>
</form>
{% if not books or not members %}<p class="warning">Add at least one book and one member before creating a reservation.</p>{% endif %}
{% endblock %}
